apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx-external
  namespace: ingress-nginx
spec:
  interval: 1h
  chart:
    spec:
      chart: ingress-nginx
      version: ">=4.0.0"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
      interval: 24h
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      ingressClass: nginx-external
      ingressClassResource:
        name: nginx-external
        enabled: true
        default: false
        controllerValue: "k8s.io/ingress-nginx-external"
      service:
        type: LoadBalancer
        loadBalancerIP: 100.75.30.28
      admissionWebhooks:
        enabled: true
