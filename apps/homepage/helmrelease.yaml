apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: homepage
  namespace: flux-system
spec:
  interval: 24h
  url: https://jameswynn.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 1h
  chart:
    spec:
      chart: homepage
      version: ">=1.0.0"
      sourceRef:
        kind: HelmRepository
        name: homepage
        namespace: flux-system
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    env:
      HOMEPAGE_ALLOWED_HOSTS: "homepage.bifrost22.dev"
    envFrom:
      - secretRef:
          name: homepage-grafana-token
      - secretRef:
          name: homepage-homeassistant-token
    enableRbac: true
    kubernetes:
      mode: cluster
    image:
      repository: ghcr.io/gethomepage/homepage
      tag: latest
    config:
      bookmarks:
        - Homelab:
            - GitHub Repo:
                - href: https://github.com/Lucasade22/homelab
                  icon: github.png
      widgets:
        - kubernetes:
            cluster:
              show: true
              cpu: true
              memory: true
              showLabel: true
              label: yggdrasil
            nodes:
              show: true
              cpu: true
              memory: true
              showLabel: true
        - resources:
            cpu: true
            memory: true
            disk: /
            label: asgard
        - datetime:
            text_size: xl
            format:
              locale: en-GB
              dateStyle: short
              timeStyle: short
        - search:
            provider: duckduckgo
            target: _blank
      services:
        - Infrastructure:
            - ingress-nginx:
                description: Ingress controller
                icon: nginx.png
                siteMonitor: http://ingress-nginx-internal-controller.ingress-nginx.svc.cluster.local/healthz
            - Sealed Secrets:
                description: Secret encryption
                icon: kubernetes.png
                siteMonitor: http://sealed-secrets-controller.sealed-secrets.svc.cluster.local:8080/healthz
            - cert-manager:
                description: Certificate management
                icon: cert-manager.png
                siteMonitor: http://cert-manager.cert-manager.svc.cluster.local:9402/metrics
        - Monitoring:
            - Grafana:
                href: https://grafana.bifrost22.dev
                description: Cluster dashboards
                icon: grafana.png
                widget:
                  type: grafana
                  url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
                  username: admin
                  password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
        - Home:
            - Home Assistant:
                href: https://homeassistant.bifrost22.dev
                description: Smart home control
                icon: home-assistant.png
                widget:
                  type: homeassistant
                  url: http://homeassistant-home-assistant.homeassistant.svc.cluster.local:8080
                  key: "{{HOMEPAGE_VAR_HOMEASSISTANT_TOKEN}}"
                  fields:
                    - people_home
                    - lights_on
                    - switches_on
      settings:
        title: Yggdrasil Homelab
        theme: dark
        color: slate
        target: _blank
