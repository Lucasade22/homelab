apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: homeassistant
  namespace: flux-system
spec:
  interval: 24h
  url: https://pajikos.github.io/home-assistant-helm-chart
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  interval: 1h
  chart:
    spec:
      chart: home-assistant
      version: ">=0.1.0"
      sourceRef:
        kind: HelmRepository
        name: homeassistant
        namespace: flux-system
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/home-assistant/home-assistant
      tag: stable
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet
    persistence:
      enabled: true
      storageClass: local-path
      size: 5Gi
    env:
      - name: TZ
        value: Europe/London
    configuration:
      configMap:
        name: homeassistant-config
